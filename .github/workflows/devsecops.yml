# Pipeline DevSecOps del sitio: escanea secretos, código, dependencias,
# genera el SBOM, revisa headers y calidad web, y publica el resultado en /seguridad.
name: DevSecOps

on:
  push:
    branches: [main]
    paths-ignore:
      - "src/data/security-report.json"
      - "public/sbom.cdx.json"
  pull_request:
  schedule:
    - cron: "0 12 * * 1" # lunes 09:00 (Argentina)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Escaneo de seguridad y calidad
    runs-on: ubuntu-latest
    permissions:
      contents: write # para publicar el reporte en main
    env:
      GITLEAKS_VERSION: "8.21.2"
      SITE_URL: https://gastonmardones.dev
      SITE_FALLBACK_URL: https://gastonmardones.netlify.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks revisa todo el historial

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build (astro check + astro build)
        run: npm run build

      - name: Preparar carpeta de reportes
        run: mkdir -p reports

      - name: Secretos en código e historial (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --no-banner --report-format json --report-path reports/gitleaks.json --exit-code 0 .

      - name: Análisis estático (Semgrep CE)
        run: >
          pipx run semgrep scan --config p/default --metrics=off --quiet
          --json --output reports/semgrep.json
          --exclude dist --exclude node_modules --exclude .astro .

      - name: Dependencias vulnerables (npm audit)
        run: npm audit --json > reports/npm-audit.json || true

      - name: SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cyclonedx-npm@4 --omit dev --output-format JSON --output-file reports/sbom.cdx.json

      - name: Headers de seguridad del sitio publicado
        run: curl -sSIf --max-time 20 "$SITE_URL/" > reports/headers.txt || curl -sSI --max-time 20 "$SITE_FALLBACK_URL/" > reports/headers.txt

      # 3 corridas y se toma la mediana de performance: Lighthouse varía mucho en runners
      # compartidos. Si alguna corrida falla se usan las que terminaron.
      - name: Calidad web (Lighthouse, mediana de 3)
        run: |
          npx --yes http-server@14 dist -p 8080 -s > /dev/null 2>&1 &
          sleep 3
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://localhost:8080/ --quiet \
              --output=json --output-path="reports/lighthouse-$i.json" \
              --chrome-flags="--headless=new --no-sandbox" \
              || echo "::warning::La corrida $i de Lighthouse falló"
          done
          node scripts/lighthouse-median.mjs reports

      - name: Consolidar reporte
        run: node scripts/security-report.mjs reports

      - name: Guardar reportes como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devsecops-reports
          path: reports/
          retention-days: 30

      # Los push hechos con GITHUB_TOKEN no disparan otro workflow, así que no hay loop.
      # No se usa [skip ci]: Netlify también lo respeta y no publicaría el reporte.
      - name: Publicar reporte en el sitio
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/security-report.json public/sbom.cdx.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el reporte"
            exit 0
          fi
          git commit -m "chore(security): actualizar reporte DevSecOps"
          git push

      - name: Gate (falla si algún control da "fail")
        run: node scripts/security-report.mjs reports --gate
